name: Build APK

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["README.md", "**/*.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      # Present only if the repository has signing secrets configured. Without
      # them the build falls back to the runner's debug key, which installs but
      # cannot upgrade an existing copy in place.
      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tria.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release build will be signed with the repository key."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret; release build will use the debug key."
          fi

      - name: Assemble debug and release
        working-directory: android
        env:
          TRIA_VERSION_CODE: ${{ github.run_number }}
          TRIA_VERSION_NAME: 1.0.${{ github.run_number }}
          TRIA_KEYSTORE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/tria.jks', runner.temp) || '' }}
          TRIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TRIA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TRIA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/tria-1.0.${{ github.run_number }}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/tria-1.0.${{ github.run_number }}-release.apk"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tria-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "## TRIA APK"
            echo
            echo "Download **tria-apk-${{ github.run_number }}** from the Artifacts section of this run,"
            echo "unzip it, and copy the APK to your phone."
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in dist/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "Install the **release** APK. Android will ask you to allow installing"
            echo "from your file manager or browser the first time."
            echo
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "Signed with the repository release key, so it upgrades in place."
            else
              echo "> Signed with a throwaway debug key generated on this runner."
              echo "> A later build will have a different signature, so upgrading means"
              echo "> uninstalling the old copy first. See \`android/README.md\` to set up"
              echo "> a stable signing key."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
