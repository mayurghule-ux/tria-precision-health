# Fetches each URL listed in qsi-offline/PROBE_URLS from a GitHub runner and reports the
# HTTP status plus the first part of the body as check-run annotations. The cloud session
# that maintains this repo cannot reach huggingface.co itself, and runner logs are not
# readable from it either, so annotations are the one channel that works.
name: Probe model hosts
on:
  push:
    paths: ["qsi-offline/PROBE_URLS"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set -uo pipefail
          while read -r url; do
            [ -n "$url" ] || continue
            code=$(curl -sIL -o /dev/null -m 60 -w '%{http_code}' "$url")
            body=$(curl -sL -m 60 --range 0-3000 "$url" | tr -d '\r' | tr '\n%' '  ' | cut -c1-3000)
            echo "::notice::HTTP $code $url :: $body"
          done < qsi-offline/PROBE_URLS
